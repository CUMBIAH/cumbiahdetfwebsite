<script>
// Draws the workflow arrows between the homepage cards. The arrows come from
// the `workflow: outputs:` front matter of each analysis document (see
// _workflow/workflow.ejs.md). Arrows are only ever horizontal, vertical or a
// single right angle: cards that share a row or column get a straight arrow,
// anything else gets an elbow (across, then down or up).
(function () {
  const SVGNS = "http://www.w3.org/2000/svg";
  const GAP = 8;        // space between an arrow end and the card edge, px
  const ICON_DIR = "images/icons/";

  function draw(root) {
    const svg = root.querySelector(".workflow-arrows");
    const labels = root.querySelector(".workflow-labels");
    const edges = JSON.parse(decodeURIComponent(root.dataset.edges || "%5B%5D"));
    svg.innerHTML = "";
    labels.innerHTML = "";

    // Arrows are only drawn when the cards are laid out as a grid.
    if (getComputedStyle(svg).display === "none") return;

    const box = root.getBoundingClientRect();
    svg.setAttribute("width", box.width);
    svg.setAttribute("height", box.height);
    svg.setAttribute("viewBox", `0 0 ${box.width} ${box.height}`);

    const defs = document.createElementNS(SVGNS, "defs");
    defs.innerHTML =
      '<marker id="wf-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
      '<path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker>';
    svg.appendChild(defs);

    const rectOf = (id) => {
      const el = root.querySelector(`.workflow-node[data-wf-id="${id}"] .card`);
      if (!el) return null;
      const r = el.getBoundingClientRect();
      const left = r.left - box.left, top = r.top - box.top;
      return { left, top, right: left + r.width, bottom: top + r.height,
               cx: left + r.width / 2, cy: top + r.height / 2 };
    };

    // Labels drawn so far, by "from>to", so a later arrow can join one.
    const drawn = {};

    const makeLabel = (e, label) => {
      if (!e.label && !e.icon) return null;
      const lab = document.createElement("button");
      lab.type = "button";
      lab.className = `workflow-label is-${label.place}` + (e.dashed ? " is-dashed" : "");
      lab.style.left = `${label.x}px`;
      lab.style.top = `${label.y}px`;
      if (label.width) lab.style.maxWidth = `${Math.max(label.width, 96)}px`;
      lab.innerHTML = iconHtml(e.icon) + `<span>${e.label}</span>`;
      lab.setAttribute("aria-haspopup", "dialog");
      lab.setAttribute("aria-label", `${e.label}: ${e.fromTitle} to ${e.toTitle}. Show details`);
      lab.addEventListener("click", (ev) => {
        ev.stopPropagation();
        togglePopover(root, lab, e);
      });
      labels.appendChild(lab);
      return lab;
    };

    const addPath = (pts, dashed) => {
      const path = document.createElementNS(SVGNS, "polyline");
      path.setAttribute("points", pts.map((p) => p.join(",")).join(" "));
      path.setAttribute("marker-end", "url(#wf-head)");
      if (dashed) path.setAttribute("class", "is-dashed");
      svg.appendChild(path);
    };

    // Arrows between cards first, then arrows that join another arrow.
    const ordered = edges.filter((e) => !e.joins).concat(edges.filter((e) => e.joins));

    for (const e of ordered) {
      const a = rectOf(e.from);
      if (!a) continue;

      if (e.joins) {
        // An arrow into another arrow's label: out of the side of the source
        // card (below its own row arrow), across to the label, then down or up
        // onto it.
        const target = drawn[`${e.joins}>${e.to}`];
        if (!target) continue;
        const r = target.getBoundingClientRect();
        const tx = r.left - box.left + r.width / 2;
        const below = r.top - box.top > a.cy;
        const ty = below ? r.top - box.top - GAP / 2 : r.bottom - box.top + GAP / 2;
        const dirX = tx > a.cx ? 1 : -1;
        const x1 = dirX > 0 ? a.right + GAP : a.left - GAP;
        const y0 = Math.min(a.cy + 60, a.bottom - 24);
        addPath([[x1, y0], [tx, y0], [tx, ty]], e.dashed);
        makeLabel(e, { x: tx, y: (y0 + a.bottom) / 2 + 8, place: "on",
                       width: 2 * Math.abs(tx - x1) });
        continue;
      }

      const b = rectOf(e.to);
      if (!b) continue;

      let pts, label;
      const overlapY = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
      const overlapX = Math.min(a.right, b.right) - Math.max(a.left, b.left);

      if (overlapY > 0 && (b.left >= a.right || b.right <= a.left)) {
        // Same row: straight across, label above the arrow.
        const y = (Math.max(a.top, b.top) + Math.min(a.bottom, b.bottom)) / 2;
        const dir = b.cx > a.cx ? 1 : -1;
        const x1 = dir > 0 ? a.right + GAP : a.left - GAP;
        const x2 = dir > 0 ? b.left - GAP : b.right + GAP;
        pts = [[x1, y], [x2, y]];
        label = { x: (x1 + x2) / 2, y: y - 6, place: "above", width: Math.abs(x2 - x1) + 16 };
      } else if (overlapX > 0) {
        // Same column: straight down or up, label to the left of the arrow.
        const x = (Math.max(a.left, b.left) + Math.min(a.right, b.right)) / 2;
        const dir = b.cy > a.cy ? 1 : -1;
        const y1 = dir > 0 ? a.bottom + GAP : a.top - GAP;
        const y2 = dir > 0 ? b.top - GAP : b.bottom + GAP;
        pts = [[x, y1], [x, y2]];
        label = { x: x - 10, y: (y1 + y2) / 2, place: "left" };
      } else {
        // Elbow: out of the side of the source, then down or up into the target.
        const dirX = b.cx > a.cx ? 1 : -1, dirY = b.cy > a.cy ? 1 : -1;
        const x1 = dirX > 0 ? a.right + GAP : a.left - GAP;
        const y2 = dirY > 0 ? b.top - GAP : b.bottom + GAP;
        pts = [[x1, a.cy], [b.cx, a.cy], [b.cx, y2]];
        label = { x: (x1 + b.cx) / 2, y: a.cy - 6, place: "above", width: Math.abs(b.cx - x1) };
      }

      addPath(pts, e.dashed);
      const lab = makeLabel(e, label);
      if (lab) drawn[`${e.from}>${e.to}`] = lab;
    }
  }

  function iconHtml(icon) {
    if (!icon) return "";
    const title = icon === "matlab" ? "MATLAB .mat files" : icon === "pamguard" ? "PAMGuard data" : icon;
    return `<img class="workflow-icon" src="${ICON_DIR}${icon}.png" alt="" title="${title}">`;
  }

  // The popup that describes the data on an arrow. One per diagram, filled
  // and placed under whichever label was clicked.
  function closePopover(root) {
    const pop = root.querySelector(".workflow-popover");
    if (!pop || pop.hidden) return;
    pop.hidden = true;
    const open = root.querySelector(".workflow-label.is-open");
    if (open) { open.classList.remove("is-open"); open.focus({ preventScroll: true }); }
  }

  function togglePopover(root, lab, e) {
    const pop = root.querySelector(".workflow-popover");
    if (lab.classList.contains("is-open")) { closePopover(root); return; }
    closePopover(root);

    pop.innerHTML =
      `<button type="button" class="workflow-popover-close" aria-label="Close">&times;</button>` +
      `<div class="workflow-popover-title">${iconHtml(e.icon)}<span>${e.label}</span></div>` +
      `<div class="workflow-popover-route"><a href="${e.fromHref}">${e.fromTitle}</a> &rarr; <a href="${e.toHref}">${e.toTitle}</a></div>` +
      `<p>${e.details || "No description yet."}</p>`;
    pop.setAttribute("aria-label", e.label);
    pop.querySelector(".workflow-popover-close").addEventListener("click", () => closePopover(root));
    pop.hidden = false;
    lab.classList.add("is-open");

    // Below the label, centred on it, kept inside the diagram; above it if
    // there is no room underneath.
    const box = root.getBoundingClientRect();
    const r = lab.getBoundingClientRect();
    const w = pop.offsetWidth, h = pop.offsetHeight;
    let left = r.left - box.left + r.width / 2 - w / 2;
    left = Math.max(0, Math.min(left, box.width - w));
    let top = r.bottom - box.top + 8;
    if (top + h > box.height && r.top - box.top - 8 - h >= 0) top = r.top - box.top - 8 - h;
    pop.style.left = `${left}px`;
    pop.style.top = `${top}px`;
    pop.querySelector(".workflow-popover-close").focus({ preventScroll: true });
  }

  function init() {
    document.querySelectorAll(".workflow").forEach((root) => {
      const redraw = () => window.requestAnimationFrame(() => { closePopover(root); draw(root); });
      root.querySelector(".workflow-popover").addEventListener("click", (ev) => ev.stopPropagation());
      document.addEventListener("click", () => closePopover(root));
      document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") closePopover(root); });
      redraw();
      // Redraw when the diagram changes width (not height, which the popup
      // itself can change).
      let lastWidth = 0;
      if (window.ResizeObserver) new ResizeObserver((entries) => {
        const w = entries[0].contentRect.width;
        if (w !== lastWidth) { lastWidth = w; redraw(); }
      }).observe(root);
      root.querySelectorAll("img").forEach((img) => img.addEventListener("load", redraw));
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
